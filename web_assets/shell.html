<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slime Volleyball: One Slime</title>
  <style>
    body { margin: 1rem; text-align: center; font-family: system-ui, sans-serif; }
    canvas { display: block; max-width: 100%; height: auto; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>
  <canvas id="canvas" width="1125" height="563" tabindex="0" aria-label="Slime Volleyball court"></canvas>
  <p>Tap or click a menu button to start or continue a match. Drag left/right to move and up to jump. Player 1 uses Left/Right and Up. In local play, player 2 uses A/D and W.</p>
  <script>
    const canvas = document.getElementById("canvas");
    canvas.addEventListener("pointerdown", () => canvas.focus());
    canvas.addEventListener("contextmenu", (event) => event.preventDefault());
    const gameKeys = ["a", "d", "w", "arrowleft", "arrowright", "arrowup", " ", "p"];
    canvas.addEventListener("keydown", (event) => {
      if (gameKeys.includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
    });
    var Module = { canvas };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
